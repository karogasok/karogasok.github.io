# Every user-facing string on the site comes from this file, never from the
# markup. The site starts in Hungarian and may acquire a second language; when
# that happens this should be a translation job, not a rewrite.
#
# Keys are dot-namespaced by where they appear and quoted so TOML keeps them
# flat. No string may contain markup: a sentence that needs emphasis is either
# split in two or written without it.


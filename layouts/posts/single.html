{{ define "main" }}
<article class="post">
  <header class="post-head">
    <h1>{{ .Title }}</h1>
  </header>
  {{ partial "post-margin.html" . }}
  <div class="prose">
    {{ .Content }}
  </div>
</article>

{{ if or .PrevInSection .NextInSection }}
<nav class="stepper" aria-label="{{ i18n "post.nav_label" }}">
  {{- with .PrevInSection }}<a class="stepper-prev" href="{{ .RelPermalink }}"><span class="margin-label">{{ i18n "post.previous" }}</span>{{ .Title }}</a>{{ end }}
  {{- with .NextInSection }}<a class="stepper-next" href="{{ .RelPermalink }}"><span class="margin-label">{{ i18n "post.next" }}</span>{{ .Title }}</a>{{ end }}
</nav>
{{ end }}
{{ end }}

[project]
name = "karogasok-temak"
version = "0.1.0"
description = "Topic model, keywords and themes over the Varjú Károgások corpus"
readme = "README.md"
authors = [
    { name = "Zoltan Varju", email = "zoltan.varju@crowintelligence.org" },
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["nlp", "topic-modeling", "hungarian", "bertopic"]
dependencies = [
    "bertopic>=0.17",
    "sentence-transformers>=3",
    "umap-learn>=0.5",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "requests>=2.31",
    "pyyaml>=6",
    # spaCy is here for one import: spacy.lang.hu.stop_words. That module is
    # pure data and needs no model download, which is why the Hungarian
    # stopword list costs nothing.
    "spacy>=3.7",
    "keyflux>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D102", "D103", "D104", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--doctest-modules --tb=short"
testpaths = ["src", "tests"]
markers = [
    "slow: loads a real transformer; deselect with -m 'not slow'",
]

[tool.ty]

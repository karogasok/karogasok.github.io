# The site's themes. Owned by the author; the topic model only proposes.
#
# Each active theme is defined by its seeds — 3 to 8 of the author's own
# writings — and every other writing is placed by similarity to them.
# The URL is /tema/<urlize(nev)>/, so renaming a theme moves it: put the old
# name in korabbi_nevek and it redirects. A retired theme needs atiranyitas.
# The 2026 posts are deliberately NOT seeds: they are what the placement is
# tested on, and a seed would carry its theme by fiat.
# Validate with: uv run python scripts/check_themes.py


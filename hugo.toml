# Varjú Károgások — Hugo configuration.
#
# One baseURL, in one place: a custom domain is a possibility later, and when it
# arrives this is the only line that should have to change.
baseURL = "https://karogasok.github.io/"

# Hugo renamed languageCode to locale in v0.158; the spec predates that.
locale = "hu-HU"
defaultContentLanguage = "hu"
title = "Varjú Károgások"
copyright = "CC BY-NC-SA 4.0"

# Deliberately absent: buildFuture. Posts are written in batches and dripped out
# by publishDate, which only works while Hugo keeps excluding future dates. A
# scheduled Action rebuilds the site so they appear on time. See README.

# Hungarian slugs are full of ő ű á é. Left alone, Hugo puts them straight into
# the URL, where every consumer percent-encodes them differently and a pasted
# link stops being readable. Paths get folded to ASCII; the titles do not.
removePathAccents = true

enableGitInfo = false
# Deliberately not enabled: it makes Hugo generate a bare "User-agent: *" that
# silently shadows static/robots.txt and takes the Sitemap line with it.
summaryLength = 30

# No theme. The layouts are in layouts/ and are written for this site.

[taxonomies]
  # Hugo reads these as singular = "plural". The plural is both the front-matter
  # key and the default URL segment; the URLs are then given Hungarian names
  # under [permalinks.term] below.
  tag = "tags"                 # the pillar taxonomy; hubs live in content/tags/
  szerzo = "author"            # so a post's front matter stays `author: "..."`
  regi_cimke = "regi_cimkek"   # imported labels, kept away from the pillar tags

[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:slug/"
    archivum = "/archivum/:year/:slug/"
  [permalinks.term]
    author = "/szerzo/:slug/"
    # Old labels are an archive artefact, so their hubs sit inside the archive
    # rather than alongside the pillar tags. Nothing about the 2010 tag
    # vocabulary should look like an editorial pillar of the current site.
    regi_cimkek = "/archivum/cimke/:slug/"

[markup]
  [markup.goldmark.renderer]
    # The imported archive is HTML that was written by hand in a Blogger editor
    # between 2010 and 2013. Rendering it needs raw HTML to pass through.
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  mainSections = ["posts"]
  # No description here on purpose. It is composed in
  # layouts/partials/site-description.html from the author's name and the
  # home.bio string, so the visible lede and the metadata cannot say different
  # things about the same site.
  # One address for the whole site, and it is the author's own rather than
  # Crow's shared inbox.
  email = "zoltan.varju@crowintelligence.org"
  ogImage = "/assets/og.png"
  # Google Analytics measurement ID. Empty means the analytics partial renders
  # nothing at all — no script, no request — so the site stays JavaScript-free
  # until an ID is put here, and `hugo server` never phones home.
  ga = "G-ZJ5ZNVSN69"
  crowURL = "https://crowintelligence.org/"
  # The archive's real extent, measured from the exports rather than assumed.
  # Used by the archive note and the year-spine.
  archiveFrom = 2010
  archiveTo = 2024

[[params.authors]]
  key = "Varjú Zoltán"
  slug = "varju-zoltan"
  # Becomes the schema.org jobTitle, so it has to agree with how the bio in the
  # page header describes him rather than contradict it.
  role = "Számítógépes nyelvész, filozófus"
  # What the name in the header links to. A named field rather than the first
  # element of sameAs, which would silently follow whatever got added first.
  profile = "https://www.linkedin.com/in/zoltanvarju"
  sameAs = ["https://www.linkedin.com/in/zoltanvarju", "https://crowintelligence.org/"]

[[params.authors]]
  key = "Putz Orsolya"
  slug = "putz-orsolya"
  role = "Kognitív nyelvészet"
  sameAs = ["https://crowintelligence.org/"]

# No [[menu.main]]. The header carried Crow Intelligence's five items —
# Portfolio / Services / About / Blog / Contact — which made this look like a
# section of the company site. It is not: it is one person's reading journal,
# and its navigation is its own three things. Crow is still linked from the
# footer and from the homepage, where a reader looking for the commercial side
# will find it.

[services.rss]
  limit = -1

# llms.txt (https://llmstxt.org/) — a plain-text brief for machines reading the
# site. Generated rather than hand-written so its counts cannot drift from the
# build; see layouts/index.llms.txt.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]
  # No feeds for taxonomy terms. The regi_cimke taxonomy alone was publishing 94
  # of them, every one full of archive posts, advertised nowhere and findable
  # only by guessing a URL. Two feeds is the whole intent: the site feed and the
  # posts feed.
  taxonomy = ["HTML"]
  term = ["HTML"]

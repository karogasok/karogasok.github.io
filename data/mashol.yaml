  - cim: "Using Clojure in Linguistic Computing"
    hol: "ResearchGate"
    ev: 2012
    link: "https://www.researchgate.net/publication/220028786_Using_Clojure_in_Linguistic_Computing"
    leiras: "The paper examines existing resources for linguistic computing and explains why the Clojure programming language is an ideal tool for educating and researching in the humanities."
    nyelv: "en"

  - cim: "A szavak titkos élete"
    hol: "nyest.hu"
    ev: 2011
    link: "https://www.nyest.hu/hirek/a-szavak-titkos-elete"
    leiras: "A Wordnik online szótár példáján keresztül mutatja be, hogyan forradalmasítja a modern számítógépes nyelvészet és a hatalmas korpuszok használata a szavak jelentésének feltérképezését."

  - cim: "Hogyan lehet számítógépes nyelvész?"

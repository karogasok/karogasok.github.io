  - cim: "A neurális az új szexi!"
    hol: "nyest.hu"
    ev: 2016
    link: "https://www.nyest.hu/hirek/a-neuralis-az-uj-szexi"
    leiras: "A neurális hálózatok és a gépi tanulás térhódításáról, valamint ezek nyelvtechnológiai és hétköznapi alkalmazásairól szól."

  - cim: "Morális gépek"
    hol: "nyest.hu"

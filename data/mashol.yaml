    leiras: "Az írás a mesterséges intelligencia munkaerőpiacra és társadalomra gyakorolt hatásait, az automatizáció által veszélyeztetett szakmákat és a növekvő egyenlőtlenségeket elemzi."

  - cim: "A gép az ember tükre"

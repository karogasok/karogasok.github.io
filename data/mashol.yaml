    leiras: "A cikk azt vizsgálja, hogyan képes egy gép hatékonyan megtanulni a nyelvet, összehasonlítva a deduktív, szabályalapú és a statisztikai, empirikus nyelvleírást."

  - cim: "Egy kép többet mond ezer szónál"
